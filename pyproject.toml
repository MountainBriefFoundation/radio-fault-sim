[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mb-radio-fault-sim"
version = "0.1.0"
description = "Deterministic in-process queue, PTT-line, and feedback fault scenarios"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Stijn Vanveerdeghem"}]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
]

[project.scripts]
radio-fault-sim = "radio_fault_sim.__main__:main"

[project.urls]
Repository = "https://github.com/MountainBriefFoundation/radio-fault-sim"
Issues = "https://github.com/MountainBriefFoundation/radio-fault-sim/issues"

[tool.setuptools.packages.find]
where = ["src"]
